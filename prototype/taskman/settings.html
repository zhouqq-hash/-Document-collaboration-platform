<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>权重设置</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">📋 教学文档协作平台</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="../index.html">← 原型入口</a>
        <a class="nav-link" href="index.html">返回看板</a>
      </div>
    </div>
  </nav>
  <div class="container mt-4" style="max-width:600px;">
    <h4>优先级权重设置</h4>
    <p class="text-muted small">调整各项权重，算法将据此重新计算任务优先级。<strong>权重总和必须为 1.0</strong>，否则无法保存。</p>
    <form id="weightForm">
      <div class="mb-3">
        <label class="form-label">截止日期权重：<span id="wDeadlineVal">0.4</span></label>
        <input type="range" class="form-range" id="w_deadline" min="0" max="1" step="0.1" value="0.4">
      </div>
      <div class="mb-3">
        <label class="form-label">难度权重：<span id="wDifficultyVal">0.2</span></label>
        <input type="range" class="form-range" id="w_difficulty" min="0" max="1" step="0.1" value="0.2">
      </div>
      <div class="mb-3">
        <label class="form-label">工作量权重：<span id="wWorkloadVal">0.2</span></label>
        <input type="range" class="form-range" id="w_workload" min="0" max="1" step="0.1" value="0.2">
      </div>
      <div class="mb-3">
        <label class="form-label">条件依赖权重：<span id="wConditionVal">0.2</span></label>
        <input type="range" class="form-range" id="w_condition" min="0" max="1" step="0.1" value="0.2">
      </div>

      <!-- 实时显示总权重 -->
      <div class="mb-3">
        <label class="form-label">当前总权重：<span id="totalWeight" class="fw-bold">1.0</span></label>
        <div id="totalWeightHint" class="small"></div>
      </div>

      <div class="mb-3">
        <label class="form-label">当前用户（用于记录）</label>
        <input type="text" class="form-control" id="currentUser">
      </div>
      <button type="submit" class="btn btn-primary" id="btnSave">保存</button>
      <a href="index.html" class="btn btn-secondary">返回</a>
    </form>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
