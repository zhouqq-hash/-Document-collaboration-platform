<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务看板 - 教学文档协作平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">📋 教学文档协作平台</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="../index.html">← 原型入口</a>
        <a class="nav-link" href="index.html">任务看板</a>
        <a class="nav-link" href="settings.html">权重设置</a>
        <span class="nav-link text-light">👤 <span id="currentUser"></span></span>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <!-- 工具栏 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <button class="btn btn-outline-secondary btn-sm" id="btnAlgoSort">🤖 算法排序</button>
        <button class="btn btn-outline-secondary btn-sm" id="btnManualSort">✋ 手动排序</button>
        <span class="ms-2 text-muted small" id="sortModeHint">当前：算法推荐</span>
        <button class="btn btn-outline-secondary btn-sm ms-2" id="btnSampleData">📄 载入示例数据</button>
      </div>
      <a href="edit.html" class="btn btn-primary">+ 新建任务</a>
    </div>

    <!-- 筛选栏 -->
    <div class="mb-3">
      <select class="form-select form-select-sm d-inline-block w-auto" id="filterStatus">
        <option value="">全部状态</option>
        <option value="pending">未开始</option>
        <option value="in_progress">进行中</option>
        <option value="reviewing">待审核</option>
        <option value="completed">已完成</option>
        <option value="archived">已归档</option>
      </select>
      <select class="form-select form-select-sm d-inline-block w-auto ms-2" id="filterBlocked">
        <option value="">全部</option>
        <option value="blocked">仅阻塞</option>
        <option value="normal">仅正常</option>
      </select>
    </div>

    <!-- 任务列表 -->
    <div id="taskList"></div>
  </div>
  
  <!-- 底部版权信息 -->
  <footer class="text-center text-muted small py-4 mt-5">
    深思浅谋，近身远志，率意竭情
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/algo.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
