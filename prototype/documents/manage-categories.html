<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>分类管理 · 教学文档协作平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="manageCategories">
    <header class="topbar">
      <a class="brand" href="categories.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#b13a2c" />
          <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
          <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
          <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>
    <main class="container">
      <header class="page-head">
        <h1 class="page-title">分类管理</h1>
        <p class="page-subtitle">仅管理员可新建、改名和删除分类。</p>
      </header>
      <div id="pageMessage"></div>
      <div class="card" id="createCategoryCard">
        <h2 id="categoryFormTitle">新建分类</h2>
        <form id="createCategoryForm" class="form-grid">
          <div>
            <label for="categoryName">分类名称</label>
            <input id="categoryName" name="name" required />
          </div>
          <div>
            <label for="sortOrder">排序值</label>
            <input id="sortOrder" name="sort_order" type="number" value="0" />
          </div>
          <div>
            <label for="reviewTemplateSelect">AI 预审模板</label>
            <p class="muted" style="margin: -2px 0 8px">
              该分类的新版本会自动使用所选模板逐项检查。
            </p>
            <select id="reviewTemplateSelect">
              <option value="generic_document_v1">通用文档质量检查</option>
            </select>
          </div>
          <div>
            <label>默认规范（可选，最多 3 份）</label>
            <p class="muted" style="margin: -2px 0 10px">
              上传该分类的文档后，自动预审会默认对照这些规范。
            </p>
            <div id="defaultSpecOptions" class="spec-options">
              <span class="muted">加载中…</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="categorySubmitButton" type="submit">新建分类</button>
            <button class="btn btn-outline" id="categoryCancelButton" type="button" hidden>取消</button>
          </div>
        </form>
      </div>
      <div class="card" id="categoryManageCard">
        <h2>分类列表</h2>
        <div id="categoryManageList"></div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
