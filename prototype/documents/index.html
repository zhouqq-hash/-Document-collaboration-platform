<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 教学文档协作平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <header class="topbar">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#b13a2c" />
          <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
          <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
          <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>
    <main class="container login-wrap">
      <svg class="login-seal" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="8" fill="#b13a2c" />
        <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
        <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
        <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <h1>欢迎登录</h1>
      <p class="subtitle">教学文档协作平台 · 登录后进入工作台</p>
      <div class="card">
        <div id="loginNotice"></div>
        <form id="loginForm" class="form-grid">
          <div>
            <label for="username">工号</label>
            <input id="username" name="username" autocomplete="username" required />
          </div>
          <div>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p id="demoCredentials" class="muted" hidden></p>
          <button class="btn btn-primary" type="submit">登录</button>
        </form>
        <div id="wechatLogin" class="wechat-login" hidden></div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
