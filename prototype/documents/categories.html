<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文档分类 · 教学文档协作平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="categories">
    <header class="topbar">
      <a class="brand" href="categories.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#b13a2c" />
          <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
          <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
          <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>
    <main class="container">
      <header class="module-masthead">
        <div class="module-identity">
          <span class="module-seal" aria-hidden="true">文</span>
          <div>
            <h1 class="module-title">文档管理</h1>
            <p class="module-subtitle">统一维护教学文档、版本与负责人。</p>
          </div>
        </div>
        <div class="module-side">
          <p class="module-note">
            先按分类定位资料，再进入文档查看当前版本和历史记录。
          </p>
        </div>
      </header>

      <section class="category-index" aria-labelledby="categoryHeading">
        <header class="section-index-head">
          <div>
            <h2 id="categoryHeading">文档分类</h2>
            <p>选择一个分类查看其中的文档。</p>
          </div>
          <span class="section-count" id="categoryCount">正在整理分类…</span>
        </header>
        <div id="categoryList" class="grid"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
