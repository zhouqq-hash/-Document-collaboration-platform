<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新建文档 · 教学文档协作平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="createDocument">
    <header class="topbar">
      <a class="brand" href="categories.html">教学文档协作平台</a>
      <div id="topbar"></div>
    </header>
    <main class="container">
      <h1 class="page-title">新建文档</h1>
      <p class="page-subtitle">仅管理员可新建文档，并上传首个版本。</p>
      <div id="pageMessage"></div>
      <div class="card">
        <form id="createDocumentForm" class="form-grid">
          <div>
            <label for="title">文档标题</label>
            <input id="title" name="title" required />
          </div>
          <div>
            <label>所属分类</label>
            <div id="categorySelect"></div>
          </div>
          <div>
            <label>负责人</label>
            <div id="ownerSelect"></div>
          </div>
          <div>
            <label for="description">文档说明</label>
            <textarea id="description" name="description" rows="3" placeholder="可选，简要说明文档用途"></textarea>
          </div>
          <div>
            <label for="changelog">版本说明</label>
            <textarea id="changelog" name="changelog" rows="2" placeholder="如：初始版本"></textarea>
          </div>
          <div>
            <label for="file">首个版本文件</label>
            <input id="file" name="file" type="file" required />
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">创建文档</button>
            <a class="btn btn-outline" href="categories.html">返回分类</a>
          </div>
        </form>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
