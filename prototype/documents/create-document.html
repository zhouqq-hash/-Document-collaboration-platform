<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新建文档 · 教学文档协作平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="createDocument">
    <header class="topbar">
      <a class="brand" href="categories.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#b13a2c" />
          <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
          <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
          <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>
    <main class="container create-document-page">
      <header class="page-head create-page-head">
        <div>
          <p class="page-kicker">文档管理 / 新建</p>
          <h1 class="page-title">新建文档</h1>
          <p class="page-subtitle">
            填写文档信息并上传首个文件，创建后直接生成 v1，负责人可继续上传后续版本。
          </p>
        </div>
        <a class="btn btn-outline" id="backToDocuments" href="documents.html">返回文档列表</a>
      </header>

      <div id="pageMessage" aria-live="polite"></div>

      <form id="createDocumentForm" class="create-document-form" novalidate>
        <section class="card form-section">
          <div class="form-section-head">
            <span class="step-number">01</span>
            <div>
              <h2>文档信息</h2>
              <p>先确定这份文档归在哪里、由谁维护。</p>
            </div>
          </div>
          <div class="form-grid form-grid-two">
            <div class="form-field form-field-wide">
              <label for="title">文档标题 <span class="required-mark">必填</span></label>
              <input
                id="title"
                name="title"
                maxlength="200"
                autocomplete="off"
                placeholder="例如：2026 级专业培养计划"
                required
              />
              <p class="field-hint"><span id="titleCount">0</span>/200</p>
              <p class="field-error" id="titleError"></p>
            </div>
            <div class="form-field">
              <label id="categoryLabel">所属分类 <span class="required-mark">必填</span></label>
              <div id="categorySelect" aria-labelledby="categoryLabel"></div>
              <p class="field-error" id="categoryError"></p>
            </div>
            <div class="form-field">
              <label id="ownerLabel">负责人 <span class="required-mark">必填</span></label>
              <div id="ownerSelect" aria-labelledby="ownerLabel"></div>
              <p class="field-hint">负责人可上传后续版本；管理员始终可以维护。</p>
              <p class="field-error" id="ownerError"></p>
            </div>
            <div class="form-field form-field-wide">
              <label for="description">文档说明 <span class="optional-mark">可选</span></label>
              <textarea
                id="description"
                name="description"
                rows="3"
                maxlength="500"
                placeholder="简要说明文档用途、适用范围或维护要求"
              ></textarea>
              <p class="field-hint"><span id="descriptionCount">0</span>/500</p>
              <p class="field-error" id="descriptionError"></p>
            </div>
          </div>
        </section>

        <section class="card form-section">
          <div class="form-section-head">
            <span class="step-number">02</span>
            <div>
              <h2>首个版本</h2>
              <p>新建文档必须包含一个文件，系统会把它保存为 v1。</p>
            </div>
          </div>
          <div class="form-field">
            <input
              class="file-input"
              id="file"
              name="file"
              type="file"
              accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt"
              required
            />
            <label class="file-drop" id="fileDrop" for="file">
              <span class="file-drop-icon" aria-hidden="true">↑</span>
              <strong id="fileName">点击选择文件，或拖到这里</strong>
              <span>支持 PDF、Word、Excel、PPT、TXT，单个文件不超过 50 MB</span>
            </label>
            <div class="selected-file" id="selectedFile" hidden>
              <div>
                <strong id="selectedFileName"></strong>
                <span id="selectedFileMeta"></span>
              </div>
              <button class="btn btn-outline" id="clearFile" type="button">重新选择</button>
            </div>
            <p class="field-error" id="fileError"></p>
          </div>

          <details class="advanced-options">
            <summary>高级设置</summary>
            <div class="form-field">
              <label for="changelog">版本说明 <span class="optional-mark">可选</span></label>
              <input
                id="changelog"
                name="changelog"
                maxlength="500"
                value="初始版本"
                placeholder="初始版本"
              />
              <p class="field-hint">不填写时默认记为“初始版本”。</p>
            </div>
          </details>
        </section>

        <div class="create-form-actions">
          <a class="btn btn-outline" href="documents.html">取消</a>
          <button class="btn btn-primary" type="submit">创建文档并生成 v1</button>
        </div>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
