<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>编辑文档 · 教学文档协作平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="editDocument">
    <header class="topbar">
      <a class="brand" href="categories.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#b13a2c" />
          <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
          <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
          <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>
    <main class="container">
      <header class="page-head">
        <h1 class="page-title">编辑文档</h1>
        <p class="page-subtitle">文档：<span id="docTitle"></span>（仅管理员可修改）</p>
      </header>
      <div id="pageMessage"></div>
      <div class="card">
        <form id="editDocumentForm" class="form-grid">
          <div>
            <label for="title">文档标题</label>
            <input id="title" name="title" required />
          </div>
          <div>
            <label>所属分类</label>
            <div id="categorySelect"></div>
          </div>
          <div>
            <label>负责人</label>
            <div id="ownerSelect"></div>
          </div>
          <div>
            <label>状态</label>
            <div id="statusSelect"></div>
          </div>
          <div>
            <label for="description">文档说明</label>
            <textarea id="description" name="description" rows="3"></textarea>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">保存修改</button>
            <a class="btn btn-outline" href="document-detail.html" id="backLink">返回详情</a>
          </div>
        </form>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
