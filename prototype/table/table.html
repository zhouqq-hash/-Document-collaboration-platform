<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>表格详情 · 教学文档协作平台</title>
    <link rel="stylesheet" href="tables.css" />
  </head>
  <body data-page="table">
    <header class="topbar">
      <a class="brand" href="/index.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="brandMarkGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4b86cf" />
              <stop offset="100%" stop-color="#1f4473" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#brandMarkGradient)" />
          <path d="M12.2 7.5h6.1L22 11.2V23a1.6 1.6 0 0 1-1.6 1.6h-8.2A1.6 1.6 0 0 1 10.6 23V9.1A1.6 1.6 0 0 1 12.2 7.5Z" fill="#ffffff" />
          <path d="M18.3 7.5 22 11.2h-3.7z" fill="#c9dcf3" />
          <path d="M13.8 15.2h5.4M13.8 18.6h5.4" fill="none" stroke="#3b76bf" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>

    <main class="container">
      <header class="page-head">
        <div class="head-actions" style="justify-content: space-between">
          <div>
            <h1 id="tableTitle">加载中…</h1>
            <p class="subtitle" id="tableMeta"></p>
          </div>
          <div class="head-actions">
            <a class="btn btn-ghost" href="index.html">返回列表</a>
            <button class="btn btn-ghost" id="editInfoButton" type="button" hidden>编辑信息</button>
            <button class="btn btn-ghost" id="addColumnButton" type="button">新增列</button>
            <button class="btn btn-primary" id="addRowButton" type="button">新增行</button>
          </div>
        </div>
      </header>

      <div class="editor-layout">
        <section class="card grid-panel">
          <div class="selection-bar" id="selectionBar" hidden>
            <span class="selection-text"></span>
            <button class="btn btn-danger btn-sm" id="deleteSelectedButton" type="button">删除</button>
            <button class="btn btn-ghost btn-sm" id="cancelSelectionButton" type="button">取消选择</button>
          </div>
          <div class="grid-scroll">
            <table class="data-table" id="gridTable">
              <thead id="gridHead"></thead>
              <tbody id="gridBody"></tbody>
            </table>
          </div>
          <div class="hint" style="padding: 10px 4px 0">
            点击单元格行内编辑，失焦自动保存；方向键移动、Enter 下移、Tab 右移；点行号/列头选中整行/整列，Shift 连选、Ctrl 多选，Delete 或工具条删除。
          </div>
        </section>

        <aside class="card">
          <div class="tabs">
            <button class="tab active" id="tabChanges" type="button">修改记录</button>
            <button class="tab" id="tabVersions" type="button">版本历史</button>
          </div>

          <div id="changesPanel">
            <div class="panel-title">
              <span>最近修改</span>
              <button class="btn btn-ghost btn-sm" id="snapshotButton" type="button" hidden>保存快照</button>
            </div>
            <div class="change-list" id="changeList"></div>
          </div>

          <div id="versionsPanel" hidden>
            <div class="panel-title"><span>版本快照</span></div>
            <div class="version-list" id="versionList"></div>
          </div>
        </aside>
      </div>
    </main>

    <div class="dialog-backdrop" id="columnDialog" hidden>
      <div class="dialog">
        <h2>新增列</h2>
        <form class="form-grid" id="columnForm">
          <div>
            <label for="columnName">列名</label>
            <input id="columnName" required placeholder="例如：备注" />
          </div>
          <div class="dialog-actions">
            <button class="btn btn-ghost" id="cancelColumn" type="button">取消</button>
            <button class="btn btn-primary" type="submit">新增</button>
          </div>
        </form>
      </div>
    </div>

    <div class="dialog-backdrop" id="infoDialog" hidden>
      <div class="dialog">
        <h2>编辑表格信息</h2>
        <form class="form-grid" id="infoForm">
          <div>
            <label for="editName">表格名称</label>
            <input id="editName" required />
          </div>
          <div>
            <label for="editDescription">表格说明</label>
            <textarea id="editDescription" rows="3"></textarea>
          </div>
          <div class="dialog-actions">
            <button class="btn btn-ghost" id="cancelInfo" type="button">取消</button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div class="dialog-backdrop" id="snapshotDialog" hidden>
      <div class="dialog">
        <h2>保存快照</h2>
        <form class="form-grid" id="snapshotForm">
          <div>
            <label for="snapshotChangelog">快照说明</label>
            <textarea id="snapshotChangelog" rows="3" placeholder="例如：期中检查前定稿"></textarea>
          </div>
          <div class="dialog-actions">
            <button class="btn btn-ghost" id="cancelSnapshot" type="button">取消</button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div class="dialog-backdrop" id="previewDialog" hidden>
      <div class="dialog" style="width: min(720px, 100%)">
        <h2 id="previewTitle">版本预览</h2>
        <div class="grid-scroll" style="max-height: 55vh">
          <table class="data-table" id="previewTable"></table>
        </div>
        <div class="dialog-actions">
          <button class="btn btn-ghost" id="closePreview" type="button">关闭</button>
          <button class="btn btn-danger" id="rollbackFromPreview" type="button" hidden>回滚到此版本</button>
        </div>
      </div>
    </div>

    <div class="context-menu" id="contextMenu" hidden>
      <button class="context-item" id="ctxRename" type="button" hidden>重命名此列</button>
      <button class="context-item danger" id="ctxDelete" type="button"></button>
      <button class="context-item" id="ctxClearSelection" type="button">取消选择</button>
    </div>

    <div class="undo-toast" id="undoToast" hidden>
      <span class="undo-text">已删除</span>
      <button class="btn btn-ghost btn-sm" id="undoButton" type="button">撤销</button>
      <button class="undo-close" id="undoClose" type="button">×</button>
    </div>

    <div id="toastBox"></div>
    <script src="tables.js"></script>
    <script>
      const tableId = Number(qs("id"));
      let table = null;
      let activeTab = "changes";
      let activeCell = { row: null, col: null };
      let selection = { type: null, keys: [], anchor: null };

      (async function init() {
        if (!tableId) {
          window.location.href = "index.html";
          return;
        }
        try {
          const user = await getCurrentUser();
          renderTopbar(user);
          await loadAll();
          bindEvents();
        } catch (error) {
          toast(error.message, "error");
        }
      })();

      function bindEvents() {
        document.getElementById("addRowButton").addEventListener("click", onAddRow);
        document.getElementById("addColumnButton").addEventListener("click", () => {
          document.getElementById("columnDialog").hidden = false;
          document.getElementById("columnName").focus();
        });
        document.getElementById("cancelColumn").addEventListener("click", () => {
          document.getElementById("columnDialog").hidden = true;
        });
        document.getElementById("columnForm").addEventListener("submit", onAddColumn);

        document.getElementById("editInfoButton").addEventListener("click", openInfoDialog);
        document.getElementById("cancelInfo").addEventListener("click", () => {
          document.getElementById("infoDialog").hidden = true;
        });
        document.getElementById("infoForm").addEventListener("submit", onSaveInfo);

        document.getElementById("snapshotButton").addEventListener("click", () => {
          document.getElementById("snapshotChangelog").value = "";
          document.getElementById("snapshotDialog").hidden = false;
        });
        document.getElementById("cancelSnapshot").addEventListener("click", () => {
          document.getElementById("snapshotDialog").hidden = true;
        });
        document.getElementById("snapshotForm").addEventListener("submit", onSnapshot);

        document.getElementById("closePreview").addEventListener("click", () => {
          document.getElementById("previewDialog").hidden = true;
        });
        document.getElementById("tabChanges").addEventListener("click", () => switchTab("changes"));
        document.getElementById("tabVersions").addEventListener("click", () => switchTab("versions"));
        document.getElementById("deleteSelectedButton").addEventListener("click", deleteSelection);
        document.getElementById("cancelSelectionButton").addEventListener("click", clearSelection);
        document.getElementById("ctxDelete").addEventListener("click", () => {
          hideContextMenu();
          deleteSelection();
        });
        document.getElementById("ctxRename").addEventListener("click", () => {
          const key = selection.keys[0];
          hideContextMenu();
          onRenameColumn(key);
        });
        document.getElementById("ctxClearSelection").addEventListener("click", () => {
          hideContextMenu();
          clearSelection();
        });
        document.getElementById("undoButton").addEventListener("click", performUndo);
        document.getElementById("undoClose").addEventListener("click", hideUndoToast);
        document.addEventListener("click", hideContextMenu);
        document.addEventListener("keydown", (event) => {
          if (event.key !== "Delete") {
            return;
          }
          if (document.activeElement && document.activeElement.classList.contains("cell")) {
            return;
          }
          if (!table?.can_manage || !selection.keys.length) {
            return;
          }
          deleteSelection();
        });
      }

      function switchTab(tab) {
        activeTab = tab;
        document.getElementById("tabChanges").classList.toggle("active", tab === "changes");
        document.getElementById("tabVersions").classList.toggle("active", tab === "versions");
        document.getElementById("changesPanel").hidden = tab !== "changes";
        document.getElementById("versionsPanel").hidden = tab !== "versions";
      }

      async function loadAll() {
        table = await apiRequest(`/api/tables/${tableId}`);
        renderHeader();
        renderGrid();
        await Promise.all([loadChanges(), loadVersions()]);
      }

      function renderHeader() {
        document.getElementById("tableTitle").textContent = table.name;
        document.getElementById("tableMeta").textContent =
          `${table.column_count} 列 · ${table.row_count} 行 · 版本 ${table.version_number}` +
          ` · 负责人 ${table.owner?.name || ""} · 更新于 ${formatTime(table.updated_at)}`;
        document.getElementById("editInfoButton").hidden = !table.can_manage;
        document.getElementById("snapshotButton").hidden = !table.can_manage;
      }

      function cellEl(rowKey, colKey) {
        return document.querySelector(
          `.cell[data-row="${rowKey}"][data-col="${colKey}"]`
        );
      }

      function setActiveCell(rowKey, colKey) {
        activeCell = { row: rowKey, col: colKey };
        document
          .querySelectorAll(".cell-active")
          .forEach((el) => el.classList.remove("cell-active"));
        const el = cellEl(rowKey, colKey);
        if (el) {
          el.classList.add("cell-active");
        }
      }

      function clearSelection() {
        selection = { type: null, keys: [], anchor: null };
        document
          .querySelectorAll(".row-selected, .col-selected")
          .forEach((el) => el.classList.remove("row-selected", "col-selected"));
        renderSelectionBar();
      }

      function applySelection() {
        document
          .querySelectorAll(".row-selected, .col-selected")
          .forEach((el) => el.classList.remove("row-selected", "col-selected"));
        if (selection.type === "row") {
          selection.keys.forEach((key) => {
            const tr = document.querySelector(`tr[data-row="${key}"]`);
            if (tr) {
              tr.classList.add("row-selected");
            }
          });
        } else if (selection.type === "column") {
          selection.keys.forEach((key) => {
            document
              .querySelectorAll(`td[data-col="${key}"]`)
              .forEach((td) => td.classList.add("col-selected"));
          });
        }
        renderSelectionBar();
      }

      function renderSelectionBar() {
        const bar = document.getElementById("selectionBar");
        if (!bar) {
          return;
        }
        if (!selection.keys.length) {
          bar.hidden = true;
          return;
        }
        const label =
          selection.type === "row"
            ? `${selection.keys.length} 行`
            : `${selection.keys.length} 列`;
        bar.querySelector(".selection-text").textContent = `已选中 ${label}`;
        bar.hidden = false;
      }

      function toggleSelection(type, key, event) {
        const items =
          type === "row"
            ? (table.rows || []).map((row) => row.row_key)
            : (table.columns || []).map((col) => col.key);

        if (event.shiftKey && selection.type === type && selection.anchor != null) {
          const start = items.indexOf(selection.anchor);
          const end = items.indexOf(key);
          if (start >= 0 && end >= 0) {
            const lo = Math.min(start, end);
            const hi = Math.max(start, end);
            selection = { type, keys: items.slice(lo, hi + 1), anchor: selection.anchor };
            applySelection();
            return;
          }
        }

        if (event.ctrlKey || event.metaKey) {
          const set = selection.type === type ? new Set(selection.keys) : new Set();
          if (set.has(key)) {
            set.delete(key);
          } else {
            set.add(key);
          }
          selection = set.size
            ? { type, keys: [...set], anchor: key }
            : { type: null, keys: [], anchor: null };
          applySelection();
          return;
        }

        if (
          selection.type === type &&
          selection.keys.length === 1 &&
          selection.keys[0] === key
        ) {
          clearSelection();
          return;
        }
        selection = { type, keys: [key], anchor: key };
        applySelection();
      }

      function renderGrid() {
        const head = document.getElementById("gridHead");
        const body = document.getElementById("gridBody");
        const tableEl = document.getElementById("gridTable");
        const columns = table.columns || [];

        let colgroup = tableEl.querySelector("colgroup");
        if (!colgroup) {
          colgroup = document.createElement("colgroup");
          tableEl.insertBefore(colgroup, tableEl.firstChild);
        }
        colgroup.innerHTML = `
          <col class="col-rowhead" />
          ${columns
            .map(
              (col) =>
                `<col data-col="${escapeHtml(col.key)}" style="width:${Number(col.width) || 160}px" />`
            )
            .join("")}
        `;
        head.innerHTML =
          "<tr>" +
          '<th class="corner"></th>' +
          columns
            .map((col, index) => {
              const resize = table.can_manage
                ? `<span class="col-resize" data-col="${escapeHtml(col.key)}"></span>`
                : "";
              return `<th><div class="col-head" data-col="${escapeHtml(col.key)}">
                <span class="col-letter">${indexToLetters(index)}</span>
                <span class="col-name">${escapeHtml(col.name)}</span>
              </div>${resize}</th>`;
            })
            .join("") +
          "</tr>";

        const rows = table.rows || [];
        if (!rows.length) {
          body.innerHTML = `<tr><td class="empty" colspan="${columns.length + 1}">还没有行，点左上角「新增行」。</td></tr>`;
        } else {
          body.innerHTML = rows
            .map((row, rowIndex) => {
              const cells = columns
                .map((col) => {
                  const value = row.cells?.[col.key] ?? "";
                  return `<td data-col="${escapeHtml(col.key)}"><span class="cell" contenteditable="true" data-row="${escapeHtml(
                    row.row_key
                  )}" data-col="${escapeHtml(col.key)}" data-original="${escapeHtml(value)}">${escapeHtml(
                    value
                  )}</span></td>`;
                })
                .join("");
              return `<tr data-row="${escapeHtml(row.row_key)}"><td class="row-head" data-row="${escapeHtml(
                row.row_key
              )}" title="选中整行">${rowIndex + 1}</td>${cells}</tr>`;
            })
            .join("");
        }

        body.querySelectorAll(".cell").forEach((cell) => {
          cell.addEventListener("focus", () => {
            cell.classList.add("cell-editing");
            setActiveCell(cell.dataset.row, cell.dataset.col);
          });
          cell.addEventListener("blur", () => onCellBlur(cell));
          cell.addEventListener("keydown", (event) => onCellKeydown(event, cell));
        });
        body.querySelectorAll(".row-head").forEach((td) => {
          td.addEventListener("click", (event) => toggleSelection("row", td.dataset.row, event));
          td.addEventListener("contextmenu", (event) => showContextMenu(event, "row", td.dataset.row));
        });
        head.querySelectorAll(".col-head").forEach((node) => {
          node.addEventListener("click", (event) => {
            toggleSelection("column", node.dataset.col, event);
          });
          node.addEventListener("contextmenu", (event) => {
            showContextMenu(event, "column", node.dataset.col);
          });
        });
        head.querySelectorAll(".col-resize").forEach((handle) => {
          handle.addEventListener("mousedown", (event) => onResizeStart(event, handle));
        });
      }

      function onCellKeydown(event, cell) {
        if (event.key === "Enter") {
          event.preventDefault();
          moveFocus(cell, 1, 0);
        } else if (event.key === "Tab") {
          event.preventDefault();
          moveFocus(cell, 0, event.shiftKey ? -1 : 1);
        } else if (event.key === "ArrowDown") {
          event.preventDefault();
          moveFocus(cell, 1, 0);
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          moveFocus(cell, -1, 0);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          moveFocus(cell, 0, 1);
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          moveFocus(cell, 0, -1);
        } else if (event.key === "Escape") {
          cell.textContent = cell.dataset.original;
          cell.blur();
        }
      }

      function moveFocus(cell, rowDelta, colDelta) {
        const rows = table.rows || [];
        const columns = table.columns || [];
        const rowIndex = rows.findIndex((row) => row.row_key === cell.dataset.row);
        const colIndex = columns.findIndex((col) => col.key === cell.dataset.col);
        const targetRow = rows[rowIndex + rowDelta];
        const targetCol = columns[colIndex + colDelta];
        cell.blur();
        if (targetRow && targetCol) {
          const target = cellEl(targetRow.row_key, targetCol.key);
          if (target) {
            target.focus();
          }
        }
      }

      async function onCellBlur(cell) {
        cell.classList.remove("cell-editing");
        const rowKey = cell.dataset.row;
        const columnKey = cell.dataset.col;
        const value = cell.textContent;
        const original = cell.dataset.original;
        if (value === original) {
          return;
        }
        try {
          await apiRequest(`/api/tables/${tableId}/cells`, {
            method: "PATCH",
            body: JSON.stringify({ row_key: rowKey, column_key: columnKey, value }),
          });
          cell.dataset.original = value;
          const row = (table.rows || []).find((item) => item.row_key === rowKey);
          if (row) {
            row.cells = row.cells || {};
            row.cells[columnKey] = value;
          }
          toast("已保存", "success");
          await loadChanges();
        } catch (error) {
          cell.textContent = original;
          toast(error.message, "error");
        }
      }

      function onResizeStart(event, handle) {
        event.preventDefault();
        const colKey = handle.dataset.col;
        const col = (table.columns || []).find((item) => item.key === colKey);
        const colEl = document.querySelector(`col[data-col="${colKey}"]`);
        const startX = event.clientX;
        const startWidth = Number(col?.width) || 160;

        const onMove = (ev) => {
          const width = Math.max(60, Math.min(600, Math.round(startWidth + ev.clientX - startX)));
          if (colEl) {
            colEl.style.width = `${width}px`;
          }
        };
        const onUp = async (ev) => {
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          const width = Math.max(60, Math.min(600, Math.round(startWidth + ev.clientX - startX)));
          if (col) {
            col.width = width;
          }
          try {
            await apiRequest(`/api/tables/${tableId}/columns/${colKey}`, {
              method: "PATCH",
              body: JSON.stringify({ width }),
            });
            toast("列宽已保存", "success");
            await loadChanges();
          } catch (error) {
            toast(error.message, "error");
          }
        };
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      }

      async function onRenameColumn(colKey) {
        const col = (table.columns || []).find((item) => item.key === colKey);
        if (!col) {
          return;
        }
        const name = window.prompt("新列名", col.name);
        if (!name || name.trim() === col.name) {
          return;
        }
        try {
          await apiRequest(`/api/tables/${tableId}/columns/${colKey}`, {
            method: "PATCH",
            body: JSON.stringify({ name: name.trim() }),
          });
          toast("列已重命名", "success");
          await loadAll();
        } catch (error) {
          toast(error.message, "error");
        }
      }

      async function deleteSelection() {
        if (!selection.keys.length) {
          return;
        }
        try {
          let result;
          if (selection.type === "row") {
            result = await apiRequest(`/api/tables/${tableId}/rows/delete`, {
              method: "POST",
              body: JSON.stringify({ row_keys: selection.keys }),
            });
          } else {
            result = await apiRequest(`/api/tables/${tableId}/columns/delete`, {
              method: "POST",
              body: JSON.stringify({ column_keys: selection.keys }),
            });
          }
          clearSelection();
          showUndoToast(result?.version_id ?? null);
          await loadAll();
        } catch (error) {
          toast(error.message, "error");
        }
      }

      function showContextMenu(event, type, key) {
        event.preventDefault();
        event.stopPropagation();
        const inSelection =
          selection.type === type && selection.keys.includes(key);
        if (!inSelection) {
          selection = { type, keys: [key], anchor: key };
          applySelection();
        }
        const label =
          selection.type === "row"
            ? selection.keys.length > 1
              ? `删除选中的 ${selection.keys.length} 行`
              : "删除此行"
            : selection.keys.length > 1
              ? `删除选中的 ${selection.keys.length} 列`
              : "删除此列";
        document.getElementById("ctxDelete").textContent = label;
        document.getElementById("ctxRename").hidden =
          !(selection.type === "column" && selection.keys.length === 1);
        const menu = document.getElementById("contextMenu");
        menu.hidden = false;
        menu.style.left = `${event.clientX}px`;
        menu.style.top = `${event.clientY}px`;
      }

      function hideContextMenu() {
        document.getElementById("contextMenu").hidden = true;
      }

      let undoVersionId = null;
      let undoTimer = null;

      function showUndoToast(versionId) {
        undoVersionId = versionId;
        document.getElementById("undoToast").hidden = false;
        if (undoTimer) {
          clearTimeout(undoTimer);
        }
        undoTimer = setTimeout(hideUndoToast, 8000);
      }

      function hideUndoToast() {
        document.getElementById("undoToast").hidden = true;
        undoVersionId = null;
        if (undoTimer) {
          clearTimeout(undoTimer);
          undoTimer = null;
        }
      }

      async function performUndo() {
        if (undoVersionId == null) {
          return;
        }
        try {
          await apiRequest(`/api/tables/${tableId}/versions/${undoVersionId}/rollback`, {
            method: "POST",
          });
          hideUndoToast();
          toast("已撤销删除", "success");
          await loadAll();
        } catch (error) {
          toast(error.message, "error");
        }
      }

      async function onAddRow() {
        try {
          await apiRequest(`/api/tables/${tableId}/rows`, {
            method: "POST",
            body: JSON.stringify({ cells: {} }),
          });
          toast("已新增一行", "success");
          await loadAll();
        } catch (error) {
          toast(error.message, "error");
        }
      }

      async function onAddColumn(event) {
        event.preventDefault();
        const name = document.getElementById("columnName").value.trim();
        try {
          await apiRequest(`/api/tables/${tableId}/columns`, {
            method: "POST",
            body: JSON.stringify({ name }),
          });
          document.getElementById("columnDialog").hidden = true;
          document.getElementById("columnName").value = "";
          toast("已新增列", "success");
          await loadAll();
        } catch (error) {
          toast(error.message, "error");
        }
      }

      function openInfoDialog() {
        document.getElementById("editName").value = table.name;
        document.getElementById("editDescription").value = table.description || "";
        document.getElementById("infoDialog").hidden = false;
      }

      async function onSaveInfo(event) {
        event.preventDefault();
        try {
          table = await apiRequest(`/api/tables/${tableId}`, {
            method: "PATCH",
            body: JSON.stringify({
              name: document.getElementById("editName").value.trim(),
              description: document.getElementById("editDescription").value.trim(),
            }),
          });
          document.getElementById("infoDialog").hidden = true;
          renderHeader();
          await loadChanges();
          toast("已保存", "success");
        } catch (error) {
          toast(error.message, "error");
        }
      }

      async function onSnapshot(event) {
        event.preventDefault();
        try {
          await apiRequest(`/api/tables/${tableId}/versions`, {
            method: "POST",
            body: JSON.stringify({
              changelog: document.getElementById("snapshotChangelog").value.trim(),
            }),
          });
          document.getElementById("snapshotDialog").hidden = true;
          toast("快照已保存", "success");
          await loadVersions();
          table = await apiRequest(`/api/tables/${tableId}`);
          renderHeader();
        } catch (error) {
          toast(error.message, "error");
        }
      }

      async function loadChanges() {
        const listNode = document.getElementById("changeList");
        let changes = [];
        try {
          changes = await apiRequest(`/api/tables/${tableId}/changes?limit=50`);
        } catch (error) {
          listNode.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
          return;
        }
        if (!changes.length) {
          listNode.innerHTML = `<div class="empty">暂无修改记录。</div>`;
          return;
        }
        listNode.innerHTML = changes
          .map(
            (change) => `
              <div class="change-item">
                <div class="kind">${escapeHtml(CHANGE_KIND_LABELS[change.kind] || change.kind)}</div>
                <div class="summary">${escapeHtml(changeSummary(change))}</div>
                <div class="byline">${escapeHtml(change.editor?.name || "")} · ${formatTime(
                  change.created_at
                )}</div>
              </div>
            `
          )
          .join("");
      }

      async function loadVersions() {
        const listNode = document.getElementById("versionList");
        let versions = [];
        try {
          versions = await apiRequest(`/api/tables/${tableId}/versions`);
        } catch (error) {
          listNode.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
          return;
        }
        listNode.innerHTML = versions
          .map(
            (version) => `
              <div class="version-item">
                <div class="changelog"><strong>v${version.version_number}</strong> · ${escapeHtml(
                  version.changelog || "无说明"
                )}</div>
                <div class="byline">${escapeHtml(version.editor?.name || "")} · ${formatTime(
                  version.created_at
                )} · ${version.column_count} 列 / ${version.row_count} 行</div>
                <div class="actions">
                  <button class="btn btn-ghost btn-sm" data-preview="${version.id}" type="button">预览</button>
                  ${
                    table.can_manage
                      ? `<button class="btn btn-danger btn-sm" data-rollback="${version.id}" type="button">回滚</button>`
                      : ""
                  }
                </div>
              </div>
            `
          )
          .join("");

        listNode.querySelectorAll("[data-preview]").forEach((button) => {
          button.addEventListener("click", () => onPreview(Number(button.dataset.preview)));
        });
        listNode.querySelectorAll("[data-rollback]").forEach((button) => {
          button.addEventListener("click", () => onRollback(Number(button.dataset.rollback)));
        });
      }

      async function onPreview(versionId) {
        try {
          const version = await apiRequest(`/api/tables/${tableId}/versions/${versionId}`);
          document.getElementById("previewTitle").textContent =
            `版本 ${version.version_number} · ${version.changelog || "无说明"}`;
          const previewTable = document.getElementById("previewTable");
          const columns = version.columns || [];
          const head =
            "<tr>" +
            columns.map((col) => `<th>${escapeHtml(col.name)}</th>`).join("") +
            "</tr>";
          const rows = (version.rows || [])
            .map(
              (row) =>
                "<tr>" +
                columns
                  .map((col) => `<td>${escapeHtml(row.cells?.[col.key] ?? "")}</td>`)
                  .join("") +
                "</tr>"
            )
            .join("");
          previewTable.innerHTML = `<thead>${head}</thead><tbody>${
            rows || `<tr><td class="empty" colspan="${columns.length}">空表格</td></tr>`
          }</tbody>`;
          const rollbackButton = document.getElementById("rollbackFromPreview");
          rollbackButton.hidden = !table.can_manage;
          rollbackButton.dataset.version = version.id;
          document.getElementById("previewDialog").hidden = false;
        } catch (error) {
          toast(error.message, "error");
        }
      }

      async function onRollback(versionId) {
        if (!window.confirm("回滚会覆盖当前表格内容（同时保留本次回滚为新版本），确定继续吗？")) {
          return;
        }
        try {
          await apiRequest(`/api/tables/${tableId}/versions/${versionId}/rollback`, {
            method: "POST",
          });
          document.getElementById("previewDialog").hidden = true;
          toast("已回滚", "success");
          await loadAll();
        } catch (error) {
          toast(error.message, "error");
        }
      }

      document.getElementById("rollbackFromPreview").addEventListener("click", () => {
        onRollback(Number(document.getElementById("rollbackFromPreview").dataset.version));
      });
    </script>
  </body>
</html>
