<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工作台 · 教学文档协作平台</title>
    <style>
      /*
       * 工作台首页样式（墨档 · 朱批）：与 prototype/documents/styles.css 共用同一套
       * 设计基线。本页是独立静态页，所以内联一份。
       */
      :root {
        --paper: #f6f5f1;
        --surface: #fffefb;
        --surface-2: #fbfaf6;
        --line: #e4e1d8;
        --line-strong: #d1cdc1;
        --ink-soft: #edf2f6;
        --ink-tint: #d9e3ec;
        --ink: #345b7d;
        --ink-strong: #284c6b;
        --ink-deep: #1e3a53;
        --cinnabar: #b13a2c;
        --cinnabar-deep: #942f23;
        --text: #2b323a;
        --heading: #1d2833;
        --muted: #6c747e;
        --border: var(--line);
        --bg: var(--paper);
        --radius-sm: 4px;
        --radius: 6px;
        --radius-lg: 10px;
        --shadow-card: 0 1px 0 rgba(29, 40, 51, 0.03);
        --shadow-hover: 0 10px 24px rgba(29, 40, 51, 0.08);
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        --t: 170ms;
        --t-fast: 140ms;
        --font-display: "Source Han Serif SC", "Noto Serif SC", "STZhongsong",
          "STSong", "SimSun", "Songti SC", serif;
        --font-sans: "Segoe UI", "Microsoft YaHei", "PingFang SC",
          "Hiragino Sans GB", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.7;
        color: var(--text);
        background-color: var(--bg);
        background-image: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0) 280px
        );
        background-repeat: no-repeat;
      }

      ::selection {
        background: rgba(177, 58, 44, 0.16);
      }

      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 10px 32px;
        background: rgba(255, 254, 251, 0.96);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--ink-deep);
      }

      .brand-mark {
        display: block;
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }

      .topbar-user {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .user-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-deep);
        font-size: 13px;
        font-weight: 500;
      }

      .btn-logout {
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
        transition: border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
      }

      .btn-logout:hover {
        border-color: var(--line-strong);
        color: var(--ink-deep);
      }

      .container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 32px 64px;
        animation: page-in var(--t) var(--ease) both;
      }

      .page-head {
        margin: 0 0 24px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .module-masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
        align-items: end;
        gap: 36px;
        margin: 0 0 34px;
        padding: 8px 0 26px;
        border-bottom: 1px solid var(--line-strong);
      }

      .module-identity {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .module-seal {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 56px;
        height: 56px;
        border-radius: 4px;
        background: var(--cinnabar);
        color: #fff7ef;
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 600;
        line-height: 1;
        box-shadow: 5px 5px 0 #f8ece8;
      }

      .module-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.15;
        color: var(--ink-deep);
      }

      .module-subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .module-note {
        margin: 0;
        padding-left: 18px;
        border-left: 1px solid var(--line-strong);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
      }

      h1 {
        margin: 0 0 6px;
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.01em;
        line-height: 1.25;
        color: var(--heading);
      }

      .subtitle {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      .muted {
        color: var(--muted);
      }

      /* 顶部数据概览：一条台账，三格数字，发丝线分隔 */
      .ledger {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-bottom: 24px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }

      .ledger-cell {
        padding: 18px 22px;
      }

      .ledger-cell + .ledger-cell {
        border-left: 1px solid var(--line);
      }

      .ledger-value {
        display: block;
        font-family: var(--font-display);
        font-size: 30px;
        font-weight: 600;
        line-height: 1.15;
        color: var(--ink-deep);
        font-variant-numeric: tabular-nums;
      }

      .ledger-label {
        font-size: 13px;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        color: inherit;
        text-decoration: none;
        transition: box-shadow var(--t) var(--ease), border-color var(--t) var(--ease);
      }

      .card:hover {
        border-color: var(--line-strong);
        box-shadow: var(--shadow-hover);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        width: fit-content;
        padding: 2px 9px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 600;
      }

      .tag::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 1px;
        background: currentColor;
      }

      .tag-count {
        background: var(--ink-soft);
        color: var(--ink-deep);
      }

      .card h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-family: var(--font-display);
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--heading);
      }

      .card h2 .card-icon {
        display: block;
        flex: none;
        width: 26px;
        height: 26px;
      }

      .card p {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      .card-more {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: auto;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-strong);
      }

      /* 最近动态 */
      .columns {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 24px;
      }

      .panel {
        padding: 20px 22px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
      }

      .panel-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--heading);
      }

      .panel-head a {
        font-size: 13px;
        color: var(--ink-strong);
        text-decoration: none;
      }

      .panel-head a:hover {
        text-decoration: underline;
      }

      .recent-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .recent-item {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .recent-item:first-child {
        border-top: 0;
      }

      .recent-item > span:first-child {
        min-width: 0;
      }

      .recent-item a {
        color: var(--text);
        font-weight: 500;
        text-decoration: none;
      }

      .recent-item a:hover {
        color: var(--ink-deep);
      }

      .recent-sub {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }

      .recent-meta {
        flex: none;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .note {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-top: 24px;
        padding: 14px 18px;
        font-size: 14px;
        line-height: 1.8;
        color: var(--ink-deep);
        background: var(--ink-soft);
        border: 1px solid var(--ink-tint);
        border-radius: var(--radius);
      }

      .note-icon {
        flex: none;
        width: 18px;
        height: 18px;
        margin-top: 3px;
        color: var(--ink);
      }

      @keyframes page-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      @media (max-width: 720px) {
        .module-masthead {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .module-seal {
          width: 48px;
          height: 48px;
          font-size: 24px;
        }

        .module-title {
          font-size: 30px;
        }

        .module-note {
          padding: 14px 0 0;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#b13a2c" />
          <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
          <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
          <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </span>
      <div class="topbar-user" id="topbarUser"></div>
    </header>

    <main class="container" id="entryMain" style="display: none">
      <header class="module-masthead">
        <div class="module-identity">
          <span class="module-seal" aria-hidden="true">台</span>
          <div>
            <h1 class="module-title">工作台</h1>
            <p class="module-subtitle" id="welcomeText">正在加载…</p>
          </div>
        </div>
        <p class="module-note">
          文档、讨论与表格从这里进入，最近动态保持在视线之内。
        </p>
      </header>

      <section class="ledger">
        <div class="ledger-cell">
          <span class="ledger-value" id="statDocuments">–</span>
          <span class="ledger-label">教学文档</span>
        </div>
        <div class="ledger-cell">
          <span class="ledger-value" id="statTopics">–</span>
          <span class="ledger-label">讨论话题</span>
        </div>
        <div class="ledger-cell">
          <span class="ledger-value" id="statOpenTopics">–</span>
          <span class="ledger-label">讨论中</span>
        </div>
      </section>

      <div class="grid">
        <a class="card" href="documents/categories.html">
          <span class="tag tag-count" id="tagDocuments">文档管理</span>
          <h2>
            <svg class="card-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <path d="M11.5 8h6.4l3.6 3.7V23a1.5 1.5 0 0 1-1.5 1.5h-8.5A1.5 1.5 0 0 1 10 23V9.5A1.5 1.5 0 0 1 11.5 8Z" fill="none" stroke="#1e3a53" stroke-width="1.5" />
              <path d="M18 8l3.5 3.7H18z" fill="#b13a2c" opacity="0.9" />
              <path d="M13.4 15.1h5.2M13.4 18.3h5.2" stroke="#1e3a53" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>文档管理</span>
          </h2>
          <p>按分类维护教学文档，跟踪负责人、当前版本与历史版本。</p>
          <span class="card-more">进入模块</span>
        </a>

        <a class="card" href="qa/index.html">
          <span class="tag tag-count" id="tagTopics">问答讨论</span>
          <h2>
            <svg class="card-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <path d="M7 9.5A1.5 1.5 0 0 1 8.5 8h15A1.5 1.5 0 0 1 25 9.5v8a1.5 1.5 0 0 1-1.5 1.5H16l-4.6 4.6v-4.6H8.5A1.5 1.5 0 0 1 7 17.5z" fill="none" stroke="#1e3a53" stroke-width="1.5" />
              <path d="M11.5 12.5h9M11.5 16h5" stroke="#1e3a53" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="25" cy="8" r="2.4" fill="#b13a2c" />
            </svg>
            <span>问答讨论</span>
          </h2>
          <p>发起话题、按时间线聚合发言、自动汇总意见，并可与文档关联。</p>
          <span class="card-more">进入模块</span>
        </a>

        <a class="card" href="table/index.html">
          <span class="tag tag-count" id="tagTables">表格协作</span>
          <h2>
            <svg class="card-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <path d="M7 9.5A1.5 1.5 0 0 1 8.5 8h15A1.5 1.5 0 0 1 25 9.5v13a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 22.5z" fill="none" stroke="#1e3a53" stroke-width="1.5" />
              <path d="M7 13.5h18M11 8v16" stroke="#1e3a53" stroke-width="1.5" />
              <rect x="12.5" y="15" width="5" height="3" rx="0.5" fill="#b13a2c" />
            </svg>
            <span>表格协作</span>
          </h2>
          <p>多人行内编辑表格，自动记录修改，支持快照与一键回滚。</p>
          <span class="card-more">进入模块</span>
        </a>
      </div>

      <div class="columns">
        <section class="panel">
          <div class="panel-head">
            <h2>最近文档</h2>
            <a href="documents/categories.html">全部文档</a>
          </div>
          <div id="recentDocuments" class="muted">加载中…</div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2>最近讨论</h2>
            <a href="qa/index.html">全部话题</a>
          </div>
          <div id="recentTopics" class="muted">加载中…</div>
        </section>
      </div>

      <div class="note">
        <svg class="note-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
          <path d="M12 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="12" cy="7.6" r="1.1" fill="currentColor" />
        </svg>
        <span>
          话题可以关联到具体文档（甚至某个版本），文档详情页会反向列出相关讨论，方便围绕文档做决策。
        </span>
      </div>
    </main>

    <script>
      // 工作台先校验登录：未登录去登录页，登录成功后带 next 回到这里
      (function () {
        var main = document.getElementById("entryMain");

        function show() {
          if (main) {
            main.style.display = "";
          }
        }

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function formatTime(value) {
          if (!value) {
            return "-";
          }
          var date = new Date(value);
          if (isNaN(date.getTime())) {
            return value;
          }
          return date.toLocaleString("zh-CN", { hour12: false });
        }

        function api(path) {
          return fetch(path, { credentials: "same-origin" })
            .then(function (res) {
              if (!res.ok) {
                throw new Error("请求失败（" + res.status + "）");
              }
              return res.json();
            })
            .then(function (payload) {
              return payload && payload.data !== undefined ? payload.data : payload;
            });
        }

        function renderUser(user) {
          var node = document.getElementById("topbarUser");
          if (node) {
            node.innerHTML =
              '<span class="user-pill">' +
              escapeHtml(user.name) +
              " · " +
              (user.role === "admin" ? "管理员" : "教师") +
              "</span>" +
              '<button class="btn-logout" id="logoutButton" type="button">退出</button>';
            var logoutButton = document.getElementById("logoutButton");
            if (logoutButton) {
              logoutButton.addEventListener("click", function () {
                fetch("/api/auth/logout", {
                  method: "POST",
                  credentials: "same-origin",
                })
                  .catch(function () {})
                  .then(function () {
                    window.location.replace("/documents/index.html?next=/");
                  });
              });
            }
          }
          var welcome = document.getElementById("welcomeText");
          if (welcome) {
            welcome.textContent =
              user.name + "，欢迎回来。这里是模块入口和最近动态。";
          }
        }

        function renderDocuments(documents) {
          var stat = document.getElementById("statDocuments");
          if (stat) {
            stat.textContent = documents.length;
          }
          var tag = document.getElementById("tagDocuments");
          if (tag) {
            tag.textContent = "共 " + documents.length + " 份文档";
          }
          var listNode = document.getElementById("recentDocuments");
          if (!listNode) {
            return;
          }
          listNode.classList.remove("muted");
          listNode.innerHTML = documents.length
            ? '<ul class="recent-list">' +
              documents
                .slice(0, 5)
                .map(function (doc) {
                  return (
                    '<li class="recent-item">' +
                    "<span>" +
                    '<a href="/documents/document-detail.html?id=' +
                    doc.id +
                    '">' +
                    escapeHtml(doc.title) +
                    "</a>" +
                    '<span class="recent-sub">' +
                    escapeHtml(doc.category ? doc.category.name : "未分类") +
                    " · " +
                    escapeHtml(doc.owner ? doc.owner.name : "") +
                    "</span>" +
                    "</span>" +
                    '<span class="recent-meta">' +
                    formatTime(doc.updated_at) +
                    "</span>" +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>"
            : '<p class="muted">还没有文档。</p>';
        }

        var topicStats = { total: null, open: null };

        function updateTopicTag() {
          var tag = document.getElementById("tagTopics");
          if (!tag || topicStats.total === null) {
            return;
          }
          tag.textContent =
            topicStats.total +
            " 个话题" +
            (topicStats.open === null ? "" : " · " + topicStats.open + " 个讨论中");
        }

        function renderTopics(result) {
          var topics = (result && result.items) || [];
          var total =
            result && typeof result.total === "number"
              ? result.total
              : topics.length;
          topicStats.total = total;
          var statTopics = document.getElementById("statTopics");
          if (statTopics) {
            statTopics.textContent = total;
          }
          updateTopicTag();
          var listNode = document.getElementById("recentTopics");
          if (!listNode) {
            return;
          }
          listNode.classList.remove("muted");
          listNode.innerHTML = topics.length
            ? '<ul class="recent-list">' +
              topics
                .slice(0, 5)
                .map(function (topic) {
                  var linkText = topic.document
                    ? "关联《" + escapeHtml(topic.document.title) + "》"
                    : "未关联文档";
                  return (
                    '<li class="recent-item">' +
                    "<span>" +
                    '<a href="/qa/topic.html?id=' +
                    topic.id +
                    '">' +
                    escapeHtml(topic.title) +
                    "</a>" +
                    '<span class="recent-sub">' +
                    linkText +
                    " · " +
                    topic.statement_count +
                    " 条发言</span>" +
                    "</span>" +
                    '<span class="recent-meta">' +
                    formatTime(topic.latest_statement_at || topic.updated_at) +
                    "</span>" +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>"
            : '<p class="muted">还没有话题。</p>';
        }

        fetch("/api/auth/me", { credentials: "same-origin" })
          .then(function (res) {
            if (res.status === 401) {
              window.location.replace("/documents/index.html?next=/");
              return null;
            }
            return res.json();
          })
          .then(function (payload) {
            if (!payload) {
              return;
            }
            renderUser(payload.data !== undefined ? payload.data : payload);
            show();
            api("/api/documents")
              .then(renderDocuments)
              .catch(function () {
                var node = document.getElementById("recentDocuments");
                if (node) {
                  node.innerHTML = '<p class="muted">文档加载失败。</p>';
                }
              });
            api("/api/qa/topics")
              .then(renderTopics)
              .catch(function () {
                var node = document.getElementById("recentTopics");
                if (node) {
                  node.innerHTML = '<p class="muted">话题加载失败。</p>';
                }
              });
            api("/api/qa/topics?status=open&page_size=1")
              .then(function (result) {
                topicStats.open = result.total || 0;
                var statOpen = document.getElementById("statOpenTopics");
                if (statOpen) {
                  statOpen.textContent = topicStats.open;
                }
                updateTopicTag();
              })
              .catch(function () {
                // 讨论中数量拿不到时保留「-」
              });
          })
          .catch(show);
      })();
    </script>
  </body>
</html>
