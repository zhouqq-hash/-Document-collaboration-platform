<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工作台 · 教学文档协作平台</title>
    <style>
      /*
       * 工作台首页样式：与 prototype/documents/styles.css 共用同一套设计基线
       * （主色阶、圆角、阴影、间距、动效）。本页是独立静态页，所以内联一份，
       * 新增页面时请对齐这里的取值。
       */
      :root {
        --brand-50: #eef4fb;
        --brand-100: #dce8f6;
        --brand-500: #3b76bf;
        --brand-600: #2f5f9e;
        --brand-700: #1f4473;
        --accent: #e8a33d;
        --text: #1f2937;
        --heading: #14243d;
        --muted: #64748b;
        --border: #e3e8ef;
        --bg: #f4f7fb;
        --surface: #fff;

        --radius-sm: 8px;
        --radius: 12px;
        --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-hover: 0 12px 28px rgba(15, 23, 42, 0.1);
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        --t: 180ms;
        --t-fast: 150ms;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
        font-size: 15px;
        line-height: 1.65;
        color: var(--text);
        background-color: var(--bg);
        background-image: radial-gradient(1100px 400px at 50% -180px, var(--brand-50), rgba(238, 244, 251, 0) 70%);
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      ::selection {
        background: rgba(59, 118, 191, 0.18);
      }

      :focus-visible {
        outline: 3px solid rgba(59, 118, 191, 0.35);
        outline-offset: 2px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 12px 32px;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: saturate(180%) blur(8px);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--brand-700);
      }

      .brand-mark {
        display: block;
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 9px;
        box-shadow: 0 4px 10px rgba(47, 95, 158, 0.28);
      }

      .topbar-user {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .user-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--brand-50);
        color: var(--brand-700);
        font-size: 13px;
        font-weight: 600;
      }

      .btn-logout {
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: #fff;
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
        transition: border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
      }

      .btn-logout:hover {
        border-color: var(--brand-100);
        color: var(--brand-700);
      }

      .container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 32px 64px;
        animation: page-in var(--t) var(--ease) both;
      }

      .page-head {
        position: relative;
        padding-left: 16px;
        margin: 0 0 28px;
      }

      .page-head::before {
        content: "";
        position: absolute;
        left: 0;
        top: 4px;
        bottom: 4px;
        width: 4px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--brand-500), var(--brand-700));
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--heading);
      }

      .subtitle {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      .muted {
        color: var(--muted);
      }

      /* 顶部数据概览 */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .stat {
        padding: 18px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
      }

      .stat-value {
        display: block;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--brand-700);
        font-variant-numeric: tabular-nums;
      }

      .stat-label {
        font-size: 13px;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .card {
        position: relative;
        display: block;
        overflow: hidden;
        padding: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        color: inherit;
        text-decoration: none;
        transition: box-shadow var(--t) var(--ease), transform var(--t) var(--ease),
          border-color var(--t) var(--ease);
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 4px;
        background: linear-gradient(90deg, var(--brand-500), var(--brand-100));
      }

      .card:hover {
        transform: translateY(-3px);
        border-color: var(--brand-100);
        box-shadow: var(--shadow-hover);
      }

      .card h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 600;
        color: var(--heading);
      }

      .card h2 .card-icon {
        display: block;
        flex: none;
        width: 26px;
        height: 26px;
      }

      .card p {
        margin: 0 0 16px;
        font-size: 14px;
        color: var(--muted);
      }

      .card-more {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--brand-600);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
      }

      .tag::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      .tag-count {
        background: var(--brand-50);
        color: var(--brand-700);
      }

      /* 最近动态 */
      .columns {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 24px;
      }

      .panel {
        padding: 20px 22px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--heading);
      }

      .panel-head a {
        font-size: 13px;
        color: var(--brand-600);
        text-decoration: none;
      }

      .panel-head a:hover {
        text-decoration: underline;
      }

      .recent-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .recent-item {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--border);
      }

      .recent-item:first-child {
        border-top: 0;
      }

      .recent-item > span:first-child {
        min-width: 0;
      }

      .recent-item a {
        color: var(--text);
        font-weight: 500;
        text-decoration: none;
      }

      .recent-item a:hover {
        color: var(--brand-700);
      }

      .recent-sub {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }

      .recent-meta {
        flex: none;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .note {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-top: 24px;
        padding: 16px 20px;
        font-size: 14px;
        line-height: 1.8;
        color: var(--brand-700);
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--brand-100);
        border-left: 4px solid var(--brand-500);
        border-radius: var(--radius);
      }

      .note-icon {
        flex: none;
        width: 18px;
        height: 18px;
        margin-top: 3px;
      }

      @keyframes page-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="brandMarkGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4b86cf" />
              <stop offset="100%" stop-color="#1f4473" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#brandMarkGradient)" />
          <path d="M12.2 7.5h6.1L22 11.2V23a1.6 1.6 0 0 1-1.6 1.6h-8.2A1.6 1.6 0 0 1 10.6 23V9.1A1.6 1.6 0 0 1 12.2 7.5Z" fill="#ffffff" />
          <path d="M18.3 7.5 22 11.2h-3.7z" fill="#c9dcf3" />
          <path d="M13.8 15.2h5.4M13.8 18.6h5.4" fill="none" stroke="#3b76bf" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </span>
      <div class="topbar-user" id="topbarUser"></div>
    </header>

    <main class="container" id="entryMain" style="display: none">
      <header class="page-head">
        <h1>工作台</h1>
        <p class="subtitle" id="welcomeText">正在加载…</p>
      </header>

      <section class="stats">
        <div class="stat">
          <span class="stat-value" id="statDocuments">–</span>
          <span class="stat-label">教学文档</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statTopics">–</span>
          <span class="stat-label">讨论话题</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statOpenTopics">–</span>
          <span class="stat-label">讨论中</span>
        </div>
      </section>

      <div class="grid">
        <a class="card" href="documents/index.html">
          <span class="tag tag-count" id="tagDocuments">文档管理</span>
          <h2>
            <svg class="card-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <rect width="32" height="32" rx="9" fill="#eef4fb" />
              <path d="M11.5 8h6.4l3.6 3.7V23a1.5 1.5 0 0 1-1.5 1.5h-8.5A1.5 1.5 0 0 1 10 23V9.5A1.5 1.5 0 0 1 11.5 8Z" fill="#ffffff" stroke="#3b76bf" stroke-width="1.2" />
              <path d="M13.4 15.1h5.2M13.4 18.3h5.2" stroke="#3b76bf" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <span>文档管理</span>
          </h2>
          <p>按分类维护教学文档，跟踪负责人、当前版本与历史版本。</p>
          <span class="card-more">进入模块 →</span>
        </a>

        <a class="card" href="qa/index.html">
          <span class="tag tag-count" id="tagTopics">问答讨论</span>
          <h2>
            <svg class="card-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <rect width="32" height="32" rx="9" fill="#eef4fb" />
              <path d="M7 9.5A1.5 1.5 0 0 1 8.5 8h15A1.5 1.5 0 0 1 25 9.5v8a1.5 1.5 0 0 1-1.5 1.5H16l-4.6 4.6v-4.6H8.5A1.5 1.5 0 0 1 7 17.5z" fill="#ffffff" stroke="#3b76bf" stroke-width="1.2" />
              <path d="M11.5 12.5h9M11.5 16h5" stroke="#3b76bf" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <span>问答讨论</span>
          </h2>
          <p>发起话题、按时间线聚合发言、自动汇总意见，并可与文档关联。</p>
          <span class="card-more">进入模块 →</span>
        </a>

        <a class="card" href="table/index.html">
          <span class="tag tag-count" id="tagTables">表格协作</span>
          <h2>
            <svg class="card-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <rect width="32" height="32" rx="9" fill="#eef4fb" />
              <path d="M7 9.5A1.5 1.5 0 0 1 8.5 8h15A1.5 1.5 0 0 1 25 9.5v13a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 22.5z" fill="#ffffff" stroke="#3b76bf" stroke-width="1.2" />
              <path d="M7 13.5h18M11 8v16M11 13.5h5M11 18.5h8" stroke="#3b76bf" stroke-width="1.3" stroke-linecap="round" />
            </svg>
            <span>表格协作</span>
          </h2>
          <p>多人行内编辑表格，自动记录修改，支持快照与一键回滚。</p>
          <span class="card-more">进入模块 →</span>
        </a>
      </div>

      <div class="columns">
        <section class="panel">
          <div class="panel-head">
            <h2>最近文档</h2>
            <a href="documents/index.html">全部文档</a>
          </div>
          <div id="recentDocuments" class="muted">加载中…</div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2>最近讨论</h2>
            <a href="qa/index.html">全部话题</a>
          </div>
          <div id="recentTopics" class="muted">加载中…</div>
        </section>
      </div>

      <div class="note">
        <svg class="note-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" stroke="#2f5f9e" stroke-width="1.8" />
          <path d="M12 11v6" stroke="#2f5f9e" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="12" cy="7.6" r="1.1" fill="#2f5f9e" />
        </svg>
        <span>
          话题可以关联到具体文档（甚至某个版本），文档详情页会反向列出相关讨论，方便围绕文档做决策。
        </span>
      </div>
    </main>

    <script>
      // 工作台先校验登录：未登录去登录页，登录成功后带 next 回到这里
      (function () {
        var main = document.getElementById("entryMain");

        function show() {
          if (main) {
            main.style.display = "";
          }
        }

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function formatTime(value) {
          if (!value) {
            return "-";
          }
          var date = new Date(value);
          if (isNaN(date.getTime())) {
            return value;
          }
          return date.toLocaleString("zh-CN", { hour12: false });
        }

        function api(path) {
          return fetch(path, { credentials: "same-origin" })
            .then(function (res) {
              if (!res.ok) {
                throw new Error("请求失败（" + res.status + "）");
              }
              return res.json();
            })
            .then(function (payload) {
              return payload && payload.data !== undefined ? payload.data : payload;
            });
        }

        function renderUser(user) {
          var node = document.getElementById("topbarUser");
          if (node) {
            node.innerHTML =
              '<span class="user-pill">' +
              escapeHtml(user.name) +
              " · " +
              (user.role === "admin" ? "管理员" : "教师") +
              "</span>" +
              '<button class="btn-logout" id="logoutButton" type="button">退出</button>';
            var logoutButton = document.getElementById("logoutButton");
            if (logoutButton) {
              logoutButton.addEventListener("click", function () {
                fetch("/api/auth/logout", {
                  method: "POST",
                  credentials: "same-origin",
                })
                  .catch(function () {})
                  .then(function () {
                    // 带上 next=/，退出后重新登录仍回到工作台
                    window.location.replace("/documents/index.html?next=/");
                  });
              });
            }
          }
          var welcome = document.getElementById("welcomeText");
          if (welcome) {
            welcome.textContent =
              user.name + "，欢迎回来。这里是模块入口和最近动态。";
          }
        }

        function renderDocuments(documents) {
          var stat = document.getElementById("statDocuments");
          if (stat) {
            stat.textContent = documents.length;
          }
          var tag = document.getElementById("tagDocuments");
          if (tag) {
            tag.textContent = "共 " + documents.length + " 份文档";
          }
          var listNode = document.getElementById("recentDocuments");
          if (!listNode) {
            return;
          }
          listNode.classList.remove("muted");
          listNode.innerHTML = documents.length
            ? '<ul class="recent-list">' +
              documents
                .slice(0, 5)
                .map(function (doc) {
                  return (
                    '<li class="recent-item">' +
                    "<span>" +
                    '<a href="/documents/document-detail.html?id=' +
                    doc.id +
                    '">' +
                    escapeHtml(doc.title) +
                    "</a>" +
                    '<span class="recent-sub">' +
                    escapeHtml(doc.category ? doc.category.name : "未分类") +
                    " · " +
                    escapeHtml(doc.owner ? doc.owner.name : "") +
                    "</span>" +
                    "</span>" +
                    '<span class="recent-meta">' +
                    formatTime(doc.updated_at) +
                    "</span>" +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>"
            : '<p class="muted">还没有文档。</p>';
        }

        var topicStats = { total: null, open: null };

        // 话题列表分页了，卡片上的数量用接口返回的 total，不靠当前页的长度
        function updateTopicTag() {
          var tag = document.getElementById("tagTopics");
          if (!tag || topicStats.total === null) {
            return;
          }
          tag.textContent =
            topicStats.total +
            " 个话题" +
            (topicStats.open === null ? "" : " · " + topicStats.open + " 个讨论中");
        }

        function renderTopics(result) {
          var topics = (result && result.items) || [];
          var total =
            result && typeof result.total === "number"
              ? result.total
              : topics.length;
          topicStats.total = total;
          var statTopics = document.getElementById("statTopics");
          if (statTopics) {
            statTopics.textContent = total;
          }
          updateTopicTag();
          var listNode = document.getElementById("recentTopics");
          if (!listNode) {
            return;
          }
          listNode.classList.remove("muted");
          listNode.innerHTML = topics.length
            ? '<ul class="recent-list">' +
              topics
                .slice(0, 5)
                .map(function (topic) {
                  var linkText = topic.document
                    ? "关联《" + escapeHtml(topic.document.title) + "》"
                    : "未关联文档";
                  return (
                    '<li class="recent-item">' +
                    "<span>" +
                    '<a href="/qa/topic.html?id=' +
                    topic.id +
                    '">' +
                    escapeHtml(topic.title) +
                    "</a>" +
                    '<span class="recent-sub">' +
                    linkText +
                    " · " +
                    topic.statement_count +
                    " 条发言</span>" +
                    "</span>" +
                    '<span class="recent-meta">' +
                    formatTime(topic.latest_statement_at || topic.updated_at) +
                    "</span>" +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>"
            : '<p class="muted">还没有话题。</p>';
        }

        fetch("/api/auth/me", { credentials: "same-origin" })
          .then(function (res) {
            if (res.status === 401) {
              window.location.replace("/documents/index.html?next=/");
              return null;
            }
            return res.json();
          })
          .then(function (payload) {
            if (!payload) {
              return;
            }
            renderUser(payload.data !== undefined ? payload.data : payload);
            show();
            api("/api/documents")
              .then(renderDocuments)
              .catch(function () {
                var node = document.getElementById("recentDocuments");
                if (node) {
                  node.innerHTML = '<p class="muted">文档加载失败。</p>';
                }
              });
            api("/api/qa/topics")
              .then(renderTopics)
              .catch(function () {
                var node = document.getElementById("recentTopics");
                if (node) {
                  node.innerHTML = '<p class="muted">话题加载失败。</p>';
                }
              });
            api("/api/qa/topics?status=open&page_size=1")
              .then(function (result) {
                topicStats.open = result.total || 0;
                var statOpen = document.getElementById("statOpenTopics");
                if (statOpen) {
                  statOpen.textContent = topicStats.open;
                }
                updateTopicTag();
              })
              .catch(function () {
                // 讨论中数量拿不到时保留「-」
