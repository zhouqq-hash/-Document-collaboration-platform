<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>通知 · 教学文档协作平台</title>
    <link rel="stylesheet" href="../documents/styles.css" />
    <link rel="stylesheet" href="qa.css" />
  </head>
  <body data-page="notifications">
    <header class="topbar">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#b13a2c" />
          <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
          <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
          <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>

    <main class="container">
      <header class="page-head">
        <h1>通知</h1>
        <p class="subtitle">举报处理结果和与你相关的提醒。</p>
      </header>

      <div class="qa-toolbar">
        <span class="muted" id="notificationSummary"></span>
        <button class="btn btn-outline" id="markAllReadButton" type="button">全部标记已读</button>
      </div>

      <div class="card">
        <div id="notificationList"></div>
      </div>
    </main>

    <script src="qa.js"></script>
  </body>
</html>
