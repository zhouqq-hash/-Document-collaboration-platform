<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>问答讨论 · 教学文档协作平台</title>
    <link rel="stylesheet" href="../documents/styles.css" />
    <link rel="stylesheet" href="qa.css" />
  </head>
  <body data-page="topics">
    <header class="topbar">
      <a class="brand" href="/" aria-label="返回工作台">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#b13a2c" />
          <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
          <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
          <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>

    <main class="container">
      <header class="module-masthead">
        <div class="module-identity">
          <span class="module-seal" aria-hidden="true">议</span>
          <div>
            <h1 class="module-title">问答讨论</h1>
            <p class="module-subtitle">围绕教学文档发起讨论，汇聚意见并形成可追溯的结论。</p>
          </div>
        </div>
        <div class="module-side">
          <p class="module-note">
            讨论可以关联到具体文档和版本，方便结论回到原始资料。
          </p>
          <div class="module-actions">
            <a class="btn btn-primary" href="new-topic.html">发起话题</a>
          </div>
        </div>
      </header>

      <header class="section-index-head">
        <div>
          <h2>话题列表</h2>
          <p>按分类、状态或关键词查找讨论。</p>
        </div>
        <span class="section-count" id="topicCount">正在汇总话题…</span>
      </header>

      <div id="topicFilterHint"></div>

      <div class="qa-filters card">
        <input id="searchInput" type="search" placeholder="搜索话题标题、说明或发言内容" />
        <select id="categoryFilter" aria-label="按分类筛选">
          <option value="">全部分类</option>
          <option value="none">未分类</option>
        </select>
        <select id="statusFilter" aria-label="按状态筛选">
          <option value="">全部状态</option>
          <option value="open">讨论中</option>
          <option value="closed">已结束</option>
        </select>
        <select id="sortFilter" aria-label="排序方式">
          <option value="latest">最近活跃</option>
          <option value="created">最新发起</option>
        </select>
        <button class="btn btn-outline" id="resetFilters" type="button">重置</button>
      </div>

      <div class="topic-stream" id="topicList" aria-live="polite"></div>

      <div class="qa-pager" id="topicPager"></div>
    </main>

    <script src="qa.js"></script>
  </body>
</html>
