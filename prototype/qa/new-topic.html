<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>发起话题 · 教学文档协作平台</title>
    <link rel="stylesheet" href="../documents/styles.css" />
    <link rel="stylesheet" href="qa.css" />
  </head>
  <body data-page="newTopic">
    <header class="topbar">
      <a class="brand" href="/" aria-label="返回工作台">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#b13a2c" />
          <path d="M11.6 7.6h6.2l3.4 3.5v12.2a1.7 1.7 0 0 1-1.7 1.7h-7.9A1.7 1.7 0 0 1 10 23.3V9.3a1.7 1.7 0 0 1 1.6-1.7Z" fill="#fff7ef" />
          <path d="M17.8 7.6 21.2 11h-3.4z" fill="#e9c9bd" />
          <path d="M13.6 15h5.6M13.6 18.4h5.6" fill="none" stroke="#b13a2c" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>

    <main class="container">
      <header class="page-head">
        <h1>发起话题</h1>
        <p class="subtitle">填写话题标题和说明，发起后即可邀请老师们参与讨论。</p>
      </header>

      <div class="card">
        <form id="newTopicForm" class="form-grid">
          <div>
            <label for="title">话题标题</label>
            <input id="title" name="title" maxlength="200" required />
          </div>
          <div>
            <label for="description">话题说明</label>
            <textarea id="description" name="description" rows="4" maxlength="500"></textarea>
          </div>
          <div>
            <label for="category">话题分类</label>
            <select id="category" name="category_id">
              <option value="">未分类</option>
            </select>
          </div>
          <div>
            <label for="relatedDocument">关联文档（可选）</label>
            <select id="relatedDocument" name="document_id">
              <option value="">不关联文档</option>
            </select>
          </div>
          <div id="relatedVersionWrap" hidden>
            <label for="relatedVersion">关联版本（可选）</label>
            <select id="relatedVersion" name="version_id">
              <option value="">不指定版本</option>
            </select>
          </div>
          <div>
            <label for="endsAt">结束时间（可选）</label>
            <input id="endsAt" name="ends_at" type="datetime-local" />
          </div>
          <p class="muted">
            标题不超过 200 字，说明不超过 500 字。填了结束时间后，到点会自动结束话题，不能再发言。
          </p>
          <button class="btn btn-primary" type="submit">发起话题</button>
        </form>
      </div>
    </main>

    <script src="qa.js"></script>
  </body>
</html>
