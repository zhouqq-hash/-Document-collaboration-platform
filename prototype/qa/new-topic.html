<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>发起话题 · 教学文档协作平台</title>
    <link rel="stylesheet" href="../documents/styles.css" />
    <link rel="stylesheet" href="qa.css" />
  </head>
  <body data-page="newTopic">
    <header class="topbar">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="brandMarkGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4b86cf" />
              <stop offset="100%" stop-color="#1f4473" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#brandMarkGradient)" />
          <path d="M12.2 7.5h6.1L22 11.2V23a1.6 1.6 0 0 1-1.6 1.6h-8.2A1.6 1.6 0 0 1 10.6 23V9.1A1.6 1.6 0 0 1 12.2 7.5Z" fill="#ffffff" />
          <path d="M18.3 7.5 22 11.2h-3.7z" fill="#c9dcf3" />
          <path d="M13.8 15.2h5.4M13.8 18.6h5.4" fill="none" stroke="#3b76bf" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span>教学文档协作平台</span>
      </a>
      <div id="topbar"></div>
    </header>

    <main class="container">
      <header class="page-head">
        <h1>发起话题</h1>
        <p class="subtitle">填写话题标题和说明，发起后即可邀请老师们参与讨论。</p>
      </header>

      <div class="card">
        <form id="newTopicForm" class="form-grid">
          <div>
            <label for="title">话题标题</label>
            <input id="title" name="title" maxlength="200" required />
          </div>
          <div>
            <label for="description">话题说明</label>
            <textarea id="description" name="description" rows="4" maxlength="500"></textarea>
          </div>
          <div>
            <label for="endsAt">结束时间（可选）</label>
            <input id="endsAt" name="ends_at" type="datetime-local" />
          </div>
          <p class="muted">
            标题不超过 200 字，说明不超过 500 字。填了结束时间后，到点会自动结束话题，不能再发言。
          </p>
          <button class="btn btn-primary" type="submit">发起话题</button>
        </form>
      </div>
    </main>

    <script src="qa.js"></script>
  </body>
</html>
