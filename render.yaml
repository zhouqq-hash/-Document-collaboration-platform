# Render Blueprint：在 Render 控制台选「New > Blueprint」，指向本仓库即可自动建服务。
# 手动建 Web Service 的等价配置见 docs/deploy-render.md。
services:
  - type: web
    name: doc-collab
    runtime: python
    # 公网正式使用必须用持久盘；free 实例重启会清空 SQLite 和上传文件。
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/ready
    disk:
      name: doc-collab-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: PUBLIC_DEPLOYMENT
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/doc_collab.db
      - key: UPLOAD_FOLDER
        value: /var/data/media
      - key: BACKUP_FOLDER
        value: /var/data/backups
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # 公网环境绝不能开启模拟微信登录。
      - key: WECHAT_MOCK_ENABLED
        value: "0"
      - key: SHOW_DEMO_CREDENTIALS
        value: "0"
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      # 首次创建管理员时在 Render 控制台手动填写，至少 12 位。
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
